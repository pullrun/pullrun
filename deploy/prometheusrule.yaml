# PrometheusRule — alerting rules for Pullrun runtime anomalies.
#
# The Prometheus Operator loads these into the Prometheus instance
# automatically. Each rule has a `for:` duration so that transient
# blips (e.g. a single failed pull) don't page anyone.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pullrun-runtime-alerts
  namespace: pullrun
  labels:
    app: pullrun-runtime
    release: kube-prometheus-stack
spec:
  groups:
    - name: pullrun.runtime.availability
      interval: 30s
      rules:
        # The runtime is alive (responding to /healthz is implicit in
        # the scrape itself succeeding). If a node's runtime stops
        # being scraped for 2 minutes, the operator should investigate.
        - alert: PullrunRuntimeDown
          expr: up{job="pullrun-runtime"} == 0
          for: 2m
          labels:
            severity: critical
            team: pullrun
          annotations:
            summary: "Pullrun runtime down on {{ $labels.node }}"
            description: |
              The pullrun-runtime pod on node {{ $labels.node }} has
              not been successfully scraped for 2 minutes. The
              runtime may have crashed, the node may be unhealthy,
              or the metrics endpoint may be saturated.
            runbook_url: "https://wiki.example.com/runbooks/pullrun-runtime-down"

    - name: pullrun.runtime.pulls
      interval: 30s
      rules:
        # Pull failure rate above 25% over 5 minutes.
        - alert: PullrunPullFailureRate
          expr: |
            (
              sum by (registry) (rate(pullrun_pulls_total{status="failed"}[5m]))
              /
              sum by (registry) (rate(pullrun_pulls_total[5m]))
            ) > 0.25
          for: 5m
          labels:
            severity: warning
            team: pullrun
          annotations:
            summary: "Pullrun pull failure rate >25% from {{ $labels.registry }}"
            description: |
              More than 25% of image pulls from {{ $labels.registry }}
              have been failing over the last 5 minutes. Check the
              registry's status and the runtime's logs for OCI
              errors.

    - name: pullrun.runtime.workloads
      interval: 30s
      rules:
        # Workloads are exiting with non-zero codes frequently.
        # Suggests a broken image or a policy bug. We exclude exit
        # code "0" (clean stop) and "137" (operator-initiated kill)
        # to avoid noise from normal operations.
        - alert: PullrunWorkloadCrashLoop
          expr: |
            (
              sum by (backend) (rate(pullrun_workloads_exited_total{exit_code!~"0|137|unknown"}[10m]))
            ) > 0.1
          for: 10m
          labels:
            severity: warning
            team: pullrun
          annotations:
            summary: "Workloads crashing on {{ $labels.backend }} (>0.1/s for 10m)"
            description: |
              More than 0.1 non-clean workload exits per second over
              the last 10 minutes on backend {{ $labels.backend }}.
              This is consistent with a crash loop; check the
              workload's logs and the runtime's logs.

        # Latency: 95th percentile of pull duration >30s for 10m.
        # Most pulls should be sub-second (local store) or a few
        # seconds (small image); 30s is a strong signal of either
        # a slow registry or a network issue.
        - alert: PullrunPullLatencyHigh
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(pullrun_pull_duration_seconds_bucket[10m]))) > 30
          for: 10m
          labels:
            severity: warning
            team: pullrun
          annotations:
            summary: "Pullrun pull p95 latency >30s"
            description: |
              95th percentile of image pull duration has been over
              30 seconds for 10 minutes. Inspect the registry
              network path and consider pre-pulling critical images.

    - name: pullrun.runtime.storage
      interval: 60s
      rules:
        # Store growing unboundedly. 80% of node disk is the
        # rough threshold. We don't have node-disk-size in scope
        # from the runtime itself, so we use a simple growth-rate
        # check as a proxy.
        - alert: PullrunStoreGrowingFast
          expr: |
            deriv(pullrun_store_bytes[1h]) > 1073741824
          for: 30m
          labels:
            severity: info
            team: pullrun
          annotations:
            summary: "Pullrun store growing >1GB/hour"
            description: |
              The DAG store is growing by more than 1 GB per hour.
              Check that `pullrun prune` (Phase 6 follow-up) is
              being run on a schedule, or that image pulls are
              targeting the right store root.
