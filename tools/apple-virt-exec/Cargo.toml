[package]
name = "apple-virt-exec"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone tool: not part of the workspace. Has its own target
# dir. Modeled on `apple-virt-smoke` but with a different goal:
# boot a single VM with an initramfs that contains
# `nimbus-init`, then talk to it over vsock and run a command.
#
# This is the *minimal* end-to-end test for the Apple Virt +
# nimbus-init + vsock transport path. It does not require the
# `nimbus-runtime` gRPC service, the OCI runtime spec
# translation, or the `nimbusctl` CLI. You give it a kernel +
# initramfs + a command line, and it prints whatever the
# command prints (and exits with the command's exit code).
#
# ## Usage
#
# ```text
# ./apple-virt-exec \
#     --kernel     ~/.nimbus/kernels/vmlinux-3.31.0 \
#     --initramfs  /tmp/nimbus-initramfs.cpio.gz \
#     --rootfs     /tmp/alpine-rootfs \
#     --store      /tmp/nimbus-store \
#     --cmd        /bin/uname -- -a
# ```
#
# Exit code = workload's exit code (or 124 on timeout, 1 on
# FFI error).
[workspace]

[[bin]]
name = "apple-virt-exec"
path = "src/main.rs"

[dependencies]
# Pull in the FFI module + the per-VM attach API.
nimbus-vm = { path = "../../runtime/nimbus-vm" }

# MmapStore is the OCI materializer's backing store.
nimbus-store = { path = "../../runtime/nimbus-store" }

# Frame codec for the host<->guest vsock protocol.
nimbus-vsock = { path = "../../runtime/nimbus-vsock" }

# CLI parsing.
clap = { version = "4", features = ["derive"] }

# Async runtime — only used to build the channel adapters
# that bridge the blocking `run_session_blocking` call to
# the body-thread I/O loop.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util"] }

# Bytes wrapper for stdin chunks. Re-exported as a dep
# from nimbus-vsock, but we use it directly.
bytes = "1"

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Libdispatch binding used to pump the main queue from the
# main thread. Same rationale as `apple-virt-smoke`:
# the Apple Virt framework submits its completion handlers
# to the main queue, so the main thread must be in
# `dispatch_main()` for them to fire.
dispatch2 = "0.3"

# Used by the panic hook to call `_exit(1)` when the body
# thread panics.
libc = "0.2"

# macOS code signing: the binary must be signed with
# `com.apple.security.virtualization` or the Apple
# Virtualization framework will refuse to create VMs. Sign
# with `codesign --force --sign - --entitlements
# virt.entitlements --options runtime target/release/apple-virt-exec`.
[package.metadata.macos-entitlements]
com.apple.security.virtualization = true
