[workspace]
members = [
    "runtime/nimbus-store",
    "runtime/nimbus-oci",
    "runtime/nimbus-exec",
    "runtime/nimbus-net",
    "runtime/nimbus-vm",
    "runtime/nimbus-vsock",
    "runtime/nimbus-init",
    "runtime/nimbus-policy",
    "runtime/nimbus-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
tokio = { version = "1.37", features = ["full", "rt-multi-thread"] }
tonic = "0.11"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
rkyv = { version = "0.7", features = ["validation", "strict"] }
memmap2 = "0.9"
dashmap = "5.5"
nix = { version = "0.28", features = ["process", "sched"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
flate2 = "1.0"
tar = "0.4"
libc = "0.2"
bytes = "1.0"
rand = "0.8"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
axum = "0.7"