[package]
name = "pullrun-vsock"
version = "0.4.1"
edition = "2021"
publish = false
description = "Wire protocol and async codec for host-guest vsock communication in Pullrun microVMs"

[lib]
path = "src/lib.rs"

[dependencies]
bytes = "1"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync", "macros", "rt"] }
futures-lite = "2"
