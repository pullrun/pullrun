name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust build + test + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            runtime
            tools/apple-virt-smoke -> target
            tools/apple-virt-exec -> target
            tools/firecracker-smoke -> target
            tools/build-initramfs -> target

      - name: Build workspace
        run: cargo build --workspace

      - name: Run unit tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

  go:
    name: Go CLI build + test + vet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: cli/pullrun

    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build CLI
        run: go build -o pullrun .

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

  checks:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [rust, go]

    steps:
      - run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust build + test + lint | ${{ needs.rust.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go CLI build + test + vet | ${{ needs.go.result }} |" >> $GITHUB_STEP_SUMMARY
