# Minimal ServiceAccount for the nimbus-runtime pod. The runtime
# itself doesn't speak to the kube-apiserver (the CRI shim does that
# out-of-band), so no RBAC rules are needed yet. The placeholder is
# here for future expansion (e.g. CSI volume provisioning for the
# store).
apiVersion: v1
kind: Namespace
metadata:
  name: nimbus
  labels:
    name: nimbus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nimbus-runtime
  namespace: nimbus
